name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # auto-heal commits (audit fix, lint --fix, lockfile sync)
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Auto-heal: a stale lockfile downgrades npm ci to npm install so the
      # run keeps going; the refreshed lockfile is committed back below.
      - name: Install dependencies
        run: npm ci || npm install

      # Auto-heal: apply every non-breaking security fix; remaining advisories
      # (major-version bumps) surface as a warning instead of stopping deploys.
      - name: Audit packages (auto-heal)
        run: |
          npm audit fix || true
          npm audit || echo "::warning title=npm audit::Unfixable advisories remain - a dependency needs a manual major-version bump"

      # Auto-heal: mechanical lint issues are fixed in place and committed
      # back; only errors eslint cannot fix (real bugs) still fail the run.
      - name: Lint code (auto-heal)
        run: |
          npx eslint . --fix || true
          npm run lint

      - name: Commit auto-heal changes back to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore: auto-heal (audit fix / lint) [skip ci]"
            # someone may have pushed meanwhile - rebase, and never fail the
            # deploy over the write-back; the heal still applies to this build
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "::warning title=auto-heal::Could not push heal commit (will retry next run)"
          fi

      - name: Validate configuration JSON
        run: |
          node scripts/validate-json.js public/settings.json
          node scripts/validate-json.js public/settings.schema.json

      - name: Build project
        run: npm run build
        env:
          VITE_RESUME_LINK: ${{ secrets.VITE_RESUME_LINK }}

      - name: Generate CNAME file
        run: npm run generate-cname

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      # The Cloudflare Workers git build cannot launch Chromium, so its
      # deploys are SPA-only (prerender skips itself there). When a
      # CLOUDFLARE_API_TOKEN secret is present, deploy the prerendered dist
      # from this runner instead; without it this step is a no-op. Once the
      # token is added, disable the Workers Builds git integration in the
      # Cloudflare dashboard so the two deploys stop racing.
      - name: Deploy prerendered dist to Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Cloudflare deploy::CLOUDFLARE_API_TOKEN not set - skipping (Workers git build keeps serving the SPA-only build)"
            exit 0
          fi
          npx wrangler deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
