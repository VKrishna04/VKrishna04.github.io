<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- SEO meta tags (title, description, OG, Twitter, canonical, JSON-LD)
		     are injected at build time from settings.json by scripts/inject-seo.js.
		     Do not add static duplicates here — crawlers pick between duplicate
		     tags non-deterministically. -->

		<!-- Dark theme indicators for extensions -->
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#0a0a0a" />
		<meta name="msapplication-navbutton-color" content="#0a0a0a" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>

		<!-- Static favicon fallback -->
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="shortcut icon" type="image/png" href="/favicon-32x32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

		<!-- PWA Manifest -->
		<link rel="manifest" href="/manifest.json" />

		<!-- Preconnect to external domains -->
		<link rel="preconnect" href="https://api.github.com" />
		<link rel="preconnect" href="https://github.com" />
		<link rel="preconnect" href="https://drive.google.com" />

		<!-- Dark Reader detection -->
		<meta name="darkreader-lock" />
		<meta name="darkreader-mode" content="disabled" />

	</head>
	<body data-theme="dark">
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
